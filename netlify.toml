[build]
  # The website lives in Website/; paths below are relative to it.
  base = "Website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes (/models, /table/...) are served by the app itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
